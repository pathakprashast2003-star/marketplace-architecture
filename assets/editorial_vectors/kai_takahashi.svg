<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_kai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#046347"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="750" fill="url(#bg_kai)"/>
  
  <!-- Spatial Spheres & 3D Topology Wireframes -->
  <circle cx="480" cy="180" r="140" fill="url(#emerald)" opacity="0.65"/>
  <ellipse cx="260" cy="220" rx="200" ry="80" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.5" transform="rotate(-15 260 220)"/>
  <path d="M 40 140 Q 300 260 560 110" fill="none" stroke="url(#chrome)" stroke-width="7" opacity="0.85"/>
  <path d="M 0 520 Q 240 400 600 560 L 600 750 L 0 750 Z" fill="#064E3B" opacity="0.9"/>
  
  <!-- Stylized Spatial Director -->
  <g transform="translate(300, 160)">
    <!-- Tech Turtleneck & Coat filling down -->
    <path d="M -200 600 L -170 280 C -150 160 -80 120 0 120 C 80 120 150 160 170 280 L 200 600 Z" fill="#0B132B"/>
    <path d="M -60 130 L 0 230 L 60 130 Z" fill="#10B981"/>
    
    <!-- High Neck Collar -->
    <rect x="-26" y="55" width="52" height="75" rx="8" fill="#1E293B"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="45" rx="64" ry="74" fill="#E2B193"/>
    
    <!-- Modernist Crop Hair -->
    <path d="M -70 30 C -70 -45 70 -45 70 30 C 50 15 0 10 -70 30 Z" fill="#050811"/>
    
    <!-- VisionOS Spatial Glass Visor -->
    <path d="M -56 26 C -56 16 -28 14 0 14 C 28 14 56 16 56 26 L 52 58 C 52 68 26 70 0 70 C -26 70 -52 68 -52 58 Z" fill="#020617"/>
    <path d="M -50 28 L 50 28 L 46 54 L -46 54 Z" fill="url(#chrome)" opacity="0.85"/>
    <line x1="-35" y1="41" x2="35" y2="41" stroke="#10B981" stroke-width="3"/>
    <circle cx="0" cy="41" r="5" fill="#38BDF8"/>
    
    <!-- Minimalist Jaw & Mouth -->
    <path d="M -16 88 Q 0 96 16 88" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>