<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Find The Creative Edge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      /* Theme 1 (Default): Soft Pastel Sage Meadow */
      --sky-top: #F3FBE8;
      --sky-mid: #E2F5D1;
      --sky-deep: #C2E8A6;
      
      --wave-azure: #76B762;
      --wave-cobalt: #367226;
      --wave-soft: #9FD98B;
      
      --text-white: #459612;
      --text-dark: #0A3219;
      --text-secondary: #1F4D2B;
      --text-shadow-hero: none;
      
      --btn-primary: #0A3219;
      --btn-primary-hover: #041B0C;
      --btn-secondary-bg: #FFFFFF;
      --btn-secondary-text: #0A3219;
      --pill-specs-bg: rgba(255, 255, 255, 0.85);
      --pill-specs-text: #0A3219;
      
      --font-display: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body[data-theme="sage"] {
      --sky-top: #F3FBE8;
      --sky-mid: #E2F5D1;
      --sky-deep: #C2E8A6;
      --wave-azure: #76B762;
      --wave-cobalt: #367226;
      --wave-soft: #9FD98B;
      --text-white: #459612;
      --text-dark: #0A3219;
      --text-secondary: #1F4D2B;
      --text-shadow-hero: none;
      --btn-primary: #0A3219;
      --btn-primary-hover: #041B0C;
      --btn-secondary-bg: #FFFFFF;
      --btn-secondary-text: #0A3219;
      --pill-specs-bg: rgba(255, 255, 255, 0.85);
      --pill-specs-text: #0A3219;
    }

    body[data-theme="cobalt"] {
      --sky-top: #8EE0FE;
      --sky-mid: #68CBFD;
      --sky-deep: #47B9FD;
      --wave-azure: #4E93F5;
      --wave-cobalt: #2956D4;
      --wave-soft: #3B82F6;
      --text-white: #FFFFFF;
      --text-dark: #1E0E38;
      --text-secondary: rgba(30, 14, 56, 0.78);
      --btn-primary: #1E0E38;
      --btn-primary-hover: #120624;
      --btn-secondary-bg: rgba(255, 255, 255, 0.95);
      --btn-secondary-text: #1E0E38;
      --pill-specs-bg: rgba(255, 255, 255, 0.45);
      --pill-specs-text: #1E0E38;
      --text-shadow-hero: 0 4px 20px rgba(37, 99, 235, 0.18);
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      background: var(--sky-mid);
    }

    /* ── FULL SCREEN OPENED-UP VIEWPORT ── */
    .hero-viewport {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: linear-gradient(145deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-deep) 100%); transition: background 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 clamp(32px, 6vw, 96px);
    }

    /* ── BACKGROUND WAVES ── */
    .bg-wave-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .bg-wave-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── TWO-COLUMN HERO GRID ── */
    .hero-grid {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      position: relative;
      z-index: 10;
      height: 100%;
    }



    /* ── LEFT EDITORIAL CONTENT ── */
    .hero-left-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      max-width: 720px;
    }

    /* ── LEFT EDITORIAL CONTENT ── */
    .hero-left-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      max-width: 720px;
    }

    .headline-stack {
      display: flex;
      flex-direction: column;
      line-height: 0.88;
      letter-spacing: -0.045em;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(4.0rem, 8.0vw, 8.2rem);
      text-transform: uppercase;
      margin-bottom: 32px;
      user-select: none;
    }

    .title-row {
      display: block;
    }

    .text-white,
    .title-wefind,
    .title-the,
    .title-wefind-mobile {
      color: var(--text-white);
      text-shadow: var(--text-shadow-hero);
    }

    .text-dark {
      color: var(--text-dark);
    }

    .mobile-only {
      display: none !important;
    }

    /* Hidden on desktop; sculpted for mobile 3D depth */
    .mobile-backdrop-headline {
      display: none;
    }

    /* ── EDITORIAL CONVERSION GROUP (APPLE TACTILE BUTTONS + BADGING CAPSULE) ── */
    .hero-editorial-chunk {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
      margin-top: 4px;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0;
      flex-wrap: wrap;
    }

    .btn-discover {
      background: #0D0A1C;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      padding: 15px 32px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 
        0 10px 24px -4px rgba(13, 10, 28, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-discover:active {
      transform: scale(0.97);
    }

    .btn-discover:hover {
      background: #000000;
      transform: translateY(-2px);
      box-shadow: 
        0 14px 30px -4px rgba(13, 10, 28, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-join {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      color: #0D0A1C;
      font-size: 15px;
      font-weight: 600;
      padding: 15px 30px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        0 6px 20px -4px rgba(15, 23, 42, 0.06),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-join:active {
      transform: scale(0.97);
    }

    .btn-join:hover {
      background: rgba(255, 255, 255, 0.92);
      transform: translateY(-2px);
      box-shadow: 
        0 10px 24px -4px rgba(15, 23, 42, 0.1),
        inset 0 1px 1px #FFFFFF;
    }

    /* ── APPLE-GRADE FLOATING TELEMETRY CAPSULE ── */
    .apple-spec-bar {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px -4px rgba(17, 11, 41, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    .spec-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      transition: background 0.18s ease;
    }

    .spec-item:hover {
      background: rgba(255, 255, 255, 0.45);
    }

    .spec-icon {
      width: 14.5px;
      height: 14.5px;
      color: #0D0A1C;
      flex-shrink: 0;
    }

    .spec-value {
      font-size: 13px;
      font-weight: 600;
      color: #0D0A1C;
      letter-spacing: -0.015em;
      white-space: nowrap;
    }

    .spec-divider {
      width: 1px;
      height: 16px;
      background: rgba(17, 11, 41, 0.14);
      margin: 0 2px;
    }

    /* ── RIGHT IMAGE VIEWPORT ── */
    .hero-right-stage {
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }

    .image-container-slot {
      width: 100%;
      height: 96vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      transform: translateY(-22px);
    }

    #heroCharacterSlot {
      position: relative;
      z-index: 2;
      /* Scaled up ~7% for stronger hero presence */
      max-height: 93vh;
      max-width: 104%;
      object-fit: contain;
      object-position: bottom center;
      /* Removed duplicate CSS drop-shadow: lets the clean native baked contact shadow shine without muddy blur */
      filter: none;
      user-select: none;
      pointer-events: none;
      animation: floatSubtle 6s ease-in-out infinite alternate;
    }

    @keyframes floatSubtle {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-8px);
      }
    }

    /* ── 3-WAY LAYOUT SWITCHER ── */
    .preview-layout-switcher {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .switcher-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.6);
      padding: 0 8px 0 10px;
    }

    .switcher-tab {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .switcher-tab:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.15);
    }

    .switcher-tab.active {
      background: #2563EB;
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* ── MOBILE OPTIMIZATIONS ── */
    /* ── MOBILE OPTIMIZATIONS (100DVH NO-SCROLL ARCHITECTURE) ── */
    @media (max-width: 900px) {
      html, body {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      .hero-viewport {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        padding: 44px 0 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        overflow: hidden;
      }

      /* Compact top pill dock for layout switcher */
      .preview-layout-switcher {
        position: absolute;
        top: 8px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 320px;
        padding: 3px 4px;
        z-index: 100;
        background: rgba(13, 10, 28, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }

      .switcher-title {
        display: none;
      }

      .switcher-tab {
        font-size: 9.5px;
        padding: 5px 8px;
        flex: 1;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
      }

      .hero-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        max-width: 410px;
        margin: 0 auto;
        gap: 6px;
        overflow: visible;
      }

      /* Flatten left container so headline prefix sits at top, actions sit at bottom */
      .hero-left-content {
        display: contents;
      }

      .desktop-only {
        display: none !important;
      }

      .mobile-only {
        display: inline-block !important;
      }

      /* Centralized headline prefix: elevated a bit above */
      .headline-stack {
        order: 1;
        width: 100%;
        margin: -8px 0 2px;
        text-align: center;
        display: block;
        line-height: 1;
        padding: 0 16px;
      }

      /* Bolder, bigger, pure white prefix with atmospheric blue shadow */
      .title-wefind-mobile {
        font-size: clamp(1.85rem, 8.2vw, 2.65rem);
        font-weight: 900;
        letter-spacing: -0.015em;
        color: var(--text-white) !important;
        text-shadow: var(--text-shadow-hero);
        white-space: nowrap;
      }

      .title-creative, .title-edge {
        display: none; /* Rendered in 3D monumental backdrop behind child */
      }

      /* ── 3D CENTER HERO STAGE (CHARACTER + BACKDROP "CREATIVE EDGE") ── */
      .hero-right-stage {
        order: 2;
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        margin: 0;
        overflow: visible;
      }

      /*
       * KEY FIX: image-container-slot is now full-height and the image
       * is anchored TOP so the boy's head/drone appear in the upper third.
       * The CREATIVE EDGE backdrop is positioned absolutely at top:0
       * so it falls exactly behind the hair and face.
       */
      .image-container-slot {
        position: relative;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        transform: none;
        overflow: visible;
      }

      .mobile-backdrop-headline {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        position: absolute;
        /* Left-edge anchor, deliberate right bleed (magazine-style) */
        top: 8%;
        left: 0;
        width: auto;
        transform: none;
        pointer-events: none;
        z-index: 1;
        user-select: none;
        white-space: nowrap;
      }

      .mb-word {
        font-family: var(--font-display);
        font-weight: 900;
        line-height: 0.85;
        color: var(--text-dark, #0A3219);
        text-transform: uppercase;
        /* Strong text fill, no shadow clutter */
        text-shadow: none;
      }

      /* CREATIVE: fills full viewport width behind drone + hair */
      .mb-creative {
        font-size: clamp(3.2rem, 17.5vw, 5.2rem);
        letter-spacing: -0.02em;
      }

      /* EDGE: bigger, fills behind face + chest */
      .mb-edge {
        font-size: clamp(3.6rem, 21vw, 6.2rem);
        letter-spacing: -0.02em;
        margin-top: -0.07em;
      }

      #heroCharacterSlot {
        position: relative;
        z-index: 2;
        /* Scaled down to balance with the elevated dock */
        height: 86%;
        max-height: 86%;
        width: auto;
        max-width: 88%;
        object-fit: contain;
        object-position: top center;
      }

      /* ── EDITORIAL CONVERSION GROUP (ELEVATED APPLE TACTILE DOCK) ── */
      .hero-editorial-chunk {
        order: 3;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        /* Lift dock upwards further into comfortable lower-third thumb zone */
        margin: 0 0 62px;
        padding: 0 16px;
        position: relative;
        z-index: 10;
      }

      .action-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        max-width: 352px;
        margin: 0;
      }

      .btn-discover, .btn-join {
        flex: 1;
        justify-content: center;
        text-align: center;
        padding: 13.5px 18px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.015em;
        border-radius: 9999px;
        white-space: nowrap;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease, background 0.15s ease;
      }

      /* Apple Obsidian Primary Button */
      .btn-discover {
        background: #000000;
        color: #FFFFFF;
        box-shadow: 
          0 10px 28px -4px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.12);
        gap: 7px;
      }
      .btn-discover:active {
        transform: scale(0.96);
      }

      /* Apple Frosted Acrylic Glass Secondary Button */
      .btn-join {
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        color: #0F172A;
        border: 1px solid rgba(255, 255, 255, 0.88);
        box-shadow: 
          0 8px 24px -4px rgba(15, 23, 42, 0.08),
          inset 0 1px 1.5px rgba(255, 255, 255, 0.95);
      }
      .btn-join:active {
        transform: scale(0.96);
      }

      /* Apple Precision Telemetry Glass Capsule */
      .apple-spec-bar {
        width: 100%;
        max-width: 352px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 12px;
        border-radius: 9999px;
        margin: 0;
        background: rgba(255, 255, 255, 0.54);
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.82);
        box-shadow: 
          0 8px 24px -4px rgba(15, 23, 42, 0.08),
          inset 0 1px 1px rgba(255, 255, 255, 0.95);
      }

      .spec-item {
        gap: 5px;
        padding: 3px 6px;
        flex: 1;
        justify-content: center;
        display: inline-flex;
        align-items: center;
      }

      .spec-icon {
        width: 13px;
        height: 13px;
        color: var(--pill-specs-text, #0A3219);
        opacity: 0.9;
        flex-shrink: 0;
      }

      .spec-value {
        font-size: 11px;
        font-weight: 600;
        color: var(--pill-specs-text, #0A3219);
        letter-spacing: -0.015em;
        white-space: nowrap;
      }

      .spec-divider {
        width: 1px;
        height: 13px;
        background: rgba(15, 23, 42, 0.14);
        margin: 0;
        flex-shrink: 0;
      }
    }

    /* ── DRAG & EDIT STUDIO ── */
    .editor-toggle-btn {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 10001;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 6px 14px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      user-select: none;
    }
    .editor-toggle-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .editor-toggle-btn.active {
      background: #2563EB;
      border-color: #60A5FA;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.55);
    }
    @media (max-width: 900px) {
      .editor-toggle-btn {
        top: 48px;
        right: 14px;
        bottom: auto;
        left: auto;
        font-size: 11px;
        padding: 5px 12px;
      }
      .editor-hud {
        bottom: 16px;
        width: calc(100% - 20px);
        padding: 8px 10px;
      }
    }

    body.is-editing .mobile-backdrop-headline,
    body.is-editing .mb-word,
    body.is-editing #heroCharacterSlot,
    body.is-editing .headline-stack,
    body.is-editing .hero-editorial-chunk {
      pointer-events: auto !important;
      cursor: grab !important;
      touch-action: none !important;
    }
    body.is-editing .drag-selected {
      outline: 2px dashed #3B82F6 !important;
      outline-offset: 4px;
    }
    body.is-editing [contenteditable="true"]:focus {
      outline: 2px solid #60A5FA !important;
      background: rgba(37, 99, 235, 0.2) !important;
      cursor: text !important;
      border-radius: 4px;
    }

    /* Floating HUD */
    .editor-hud {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10002;
      background: rgba(11, 15, 29, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 8px 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      width: calc(100% - 24px);
      max-width: 520px;
      color: #FFFFFF;
      font-family: inherit;
      user-select: none;
    }
    body.is-editing .editor-hud {
      display: flex;
    }
    .hud-header {
      width: 100%;

  <script>
    function handleAction(type, e) {
      if (e) e.preventDefault();
      if (type === 'discover') {
        alert("✨ Discovering verified creators on NEXUS.");
      } else {
        alert("🚀 Apply to join the NEXUS creator network.");
      }
    }

    // Helper to drop in your image dynamically when ready
    function setCharacterImage(src) {
      const slot = document.getElementById('heroCharacterSlot');
      if (slot && src) {
        slot.src = src;
        slot.style.display = 'block';
      }
    }

    
    /* ── DYNAMIC MULTI-CHARACTER & THEME ENGINE (SLIDESHOW) ── */
    const THEME_KEYS = ['sage', 'cobalt'];
    const THEME_PRESETS = {
      sage: {
        themeKey: 'sage',
        imgSrc: 'assets/creator_desk_designer.png',
        imgAlt: 'Digital Creator at Modern Workstation',
        creativeWord: 'CREATIVE',
        edgeWord: 'EDGE',
        subText: 'A curated network of videographers, photographers, 3D artists and makers.',
        specs: [
          '<span class="spec-item"><span class="spec-dot" style="background:#5DB60C; box-shadow:0 0 6px #5DB60C;"></span>Top 1% Creators</span>',
          '<span class="spec-sep">/</span>',
          '<span class="spec-item">Verified Proof</span>',
          '<span class="spec-sep">/</span>',
          '<span class="spec-item">Direct Terms</span>'
        ].join(' ')
      },
      cobalt: {
        themeKey: 'cobalt',
        imgSrc: 'assets/upward_flight_pilot_drone.png',
        imgAlt: 'Upward Flight: Pilot and Drone',
        creativeWord: 'CREATIVE',
        edgeWord: 'EDGE',
        subText: 'A curated network of videographers, photographers, 3D artists and makers.',
        specs: [
          '<span class="spec-item"><span class="spec-dot"></span>Top 1% Creators</span>',
          '<span class="spec-sep">/</span>',
          '<span class="spec-item">Verified Proof</span>',
          '<span class="spec-sep">/</span>',
          '<span class="spec-item">Direct Terms</span>'
        ].join(' ')
      }
    };

    let currentThemeKey = 'sage';
    let autoRotateTimer = null;
    const ROTATION_INTERVAL_MS = 5000;

    function resetProgressBar() {
      document.querySelectorAll('.theme-timer-progress').forEach(p => {
        p.style.transition = 'none';
        p.style.width = '0%';
      });
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const activeBtn = document.querySelector(`.theme-capsule-btn[data-theme="${currentThemeKey}"]`);
          if (activeBtn) {
            const p = activeBtn.querySelector('.theme-timer-progress');
            if (p) {
              p.style.transition = `width ${ROTATION_INTERVAL_MS}ms linear`;
              p.style.width = '100%';
            }
          }
        });
      });
    }

    function switchTheme(themeKey, isManual = false) {
      if (!THEME_PRESETS[themeKey]) return;
      currentThemeKey = themeKey;
      const data = THEME_PRESETS[themeKey];
      const body = document.body;
      const faders = document.querySelectorAll('.theme-fader');
      const img = document.getElementById('heroCharacterSlot');
      const edgeDesktop = document.querySelector('.title-edge');
      const edgeMobile = document.querySelector('.mb-edge');
      const subText = document.querySelector('.hero-subheadline');
      const buttons = document.querySelectorAll('.theme-capsule-btn');

      buttons.forEach(btn => {
        const isActive = btn.getAttribute('data-theme') === themeKey;
        btn.classList.toggle('is-active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      resetProgressBar();
      faders.forEach(el => el.classList.add('is-switching'));

      setTimeout(() => {
        body.setAttribute('data-theme', themeKey);
        if (img) {
          img.src = data.imgSrc;
          img.alt = data.imgAlt;
        }
        if (edgeDesktop) edgeDesktop.textContent = data.edgeWord;
        if (edgeMobile) edgeMobile.textContent = data.edgeWord;
        if (subText) subText.textContent = data.subText;

        setTimeout(() => {
          faders.forEach(el => el.classList.remove('is-switching'));
        }, 50);
      }, 240);

      startAutoRotation();
    }

    function rotateToNextTheme() {
      const nextIdx = (THEME_KEYS.indexOf(currentThemeKey) + 1) % THEME_KEYS.length;
      switchTheme(THEME_KEYS[nextIdx], false);
    }

    function startAutoRotation() {
      if (autoRotateTimer) clearInterval(autoRotateTimer);
      autoRotateTimer = setInterval(rotateToNextTheme, ROTATION_INTERVAL_MS);
    }

    function stopAutoRotation() {
      if (autoRotateTimer) clearInterval(autoRotateTimer);
    }

    document.querySelectorAll('.theme-capsule-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTheme = btn.getAttribute('data-theme');
        if (targetTheme && targetTheme !== currentThemeKey) {
          switchTheme(targetTheme, true);
        }
      });
    });

    const heroViewport = document.querySelector('.hero-viewport');
    if (heroViewport) {
      heroViewport.addEventListener('mouseenter', stopAutoRotation);
      heroViewport.addEventListener('mouseleave', () => {
        if (!document.body.classList.contains('is-editing')) {
          startAutoRotation();
          resetProgressBar();
        }
      });
    }

    startAutoRotation();
    resetProgressBar();

    /* ── DRAG & EDIT STUDIO ENGINE (VIEWPORT ISOLATED: MOBILE vs LAPTOP) ── */
    (function initDragAndEdit() {
      const toggleBtn = document.getElementById('editorToggle');
      const hud = document.getElementById('editorHud');
      const hudTargetName = document.getElementById('hudTargetName');
      const hudCoords = document.getElementById('hudCoords');
      const hudClose = document.getElementById('hudClose');
      const hudReset = document.getElementById('hudReset');
      const hudCopyCss = document.getElementById('hudCopyCss');
      const hudFontMinus = document.getElementById('hudFontMinus');
      const hudFontPlus = document.getElementById('hudFontPlus');
      const hudZToggle = document.getElementById('hudZToggle');
      const hudColorCycle = document.getElementById('hudColorCycle');
      const hudImgMinus = document.getElementById('hudImgMinus');
      const hudImgPlus = document.getElementById('hudImgPlus');
      const hudDockUp = document.getElementById('hudDockUp');
      const hudDockDown = document.getElementById('hudDockDown');

      let isEditing = false;
      let activeTarget = null;
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;
      let hasMoved = false;

      // Responsive viewport isolation
      const STORAGE_PREFIX = 'dunes_custom_edits_v7_';
      function getActiveViewport() {
        return window.innerWidth <= 900 ? 'mobile' : 'desktop';
      }
      function getStorageKey() {
        return STORAGE_PREFIX + getActiveViewport();
      }

      // Purge legacy non-isolated cache keys
      try {
        ['dunes_custom_edits', 'dunes_custom_edits_v2', 'dunes_custom_edits_v3', 'dunes_custom_edits_v4', 'dunes_custom_edits_v5', 'dunes_custom_edits_v6'].forEach(k => localStorage.removeItem(k));
      } catch(e) {}

      // Target elements per viewport
      const targetMap = {
        // Mobile-specific targets
        'mobile-backdrop-headline': { el: () => document.querySelector('.mobile-backdrop-headline'), name: 'CREATIVE EDGE (Backdrop)', viewport: 'mobile' },
        'mb-creative': { el: () => document.querySelector('.mb-creative'), name: 'Word: CREATIVE (Mobile)', viewport: 'mobile' },
        'mb-edge': { el: () => document.querySelector('.mb-edge'), name: 'Word: EDGE (Mobile)', viewport: 'mobile' },
        'title-wefind-mobile': { el: () => document.querySelector('.title-wefind-mobile'), name: 'Prefix: WE FIND THE', viewport: 'mobile' },

        // Desktop / Laptop targets
        'headline-stack': { el: () => document.querySelector('.headline-stack'), name: 'Main Headline Stack', viewport: 'both' },
        'title-wefind': { el: () => document.querySelector('.title-wefind'), name: 'Word: WE FIND (Desktop)', viewport: 'desktop' },
        'title-the': { el: () => document.querySelector('.title-the'), name: 'Word: THE (Desktop)', viewport: 'desktop' },
        'title-creative': { el: () => document.querySelector('.title-creative'), name: 'Word: CREATIVE (Desktop)', viewport: 'desktop' },
        'title-edge': { el: () => document.querySelector('.title-edge'), name: 'Word: EDGE (Desktop)', viewport: 'desktop' },

        // Shared targets with independent per-viewport positions
        'heroCharacterSlot': { el: () => document.getElementById('heroCharacterSlot'), name: 'Pilot Image', viewport: 'both' },
        'hero-editorial-chunk': { el: () => document.querySelector('.hero-editorial-chunk'), name: 'Action Dock', viewport: 'both' }
      };

      const defaultTexts = {
        'title-wefind-mobile': 'WE FIND THE',
        'mb-creative': 'CREATIVE',
        'mb-edge': 'EDGE',
        'title-wefind': 'WE FIND',
        'title-the': 'THE',
        'title-creative': 'CREATIVE',
        'title-edge': 'EDGE'
      };

      function updateHudModeBadge() {
        const badge = document.getElementById('hudModeBadge');
        const mode = getActiveViewport();
        if (badge) {
          if (mode === 'mobile') {
            badge.textContent = '📱 Mobile (<900px)';
            badge.classList.remove('is-desktop');
          } else {
            badge.textContent = '💻 Laptop (>900px)';
            badge.classList.add('is-desktop');
          }
        }
      }

      function updateHudChipsForMode() {
        const mode = getActiveViewport();
        const chipsContainer = document.querySelector('.hud-chips');
        if (!chipsContainer) return;
        chipsContainer.innerHTML = '';

        Object.keys(targetMap).forEach(key => {
          const item = targetMap[key];
          if (item.viewport === 'both' || item.viewport === mode) {
            const btn = document.createElement('button');
            const isActive = activeTarget && getTargetKey(activeTarget) === key;
            btn.className = 'hud-chip' + (isActive ? ' active' : '');
            btn.type = 'button';
            btn.setAttribute('data-hud-select', key);
            btn.textContent = item.name;
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              selectTarget(key);
            });
            chipsContainer.appendChild(btn);
          }
        });
      }

      function clearAllInlineStyles() {
        Object.keys(targetMap).forEach(key => {
          const el = targetMap[key].el();
          if (!el) return;
          el.style.left = '';
          el.style.top = '';
          el.style.position = '';
          el.style.fontSize = '';
          el.style.zIndex = '';
          el.style.color = '';
          el.style.maxHeight = '';
          el.style.height = '';
          el.style.maxWidth = '';
          el.style.marginBottom = '';
          el.style.marginTop = '';
          el.style.right = '';
          el.style.bottom = '';
          el.querySelectorAll('*').forEach(child => {
            child.style.color = '';
          });
        });

        Object.keys(defaultTexts).forEach(k => {
          const el = targetMap[k] ? targetMap[k].el() : null;
          if (el) el.innerText = defaultTexts[k];
        });
      }

      function getTargetKey(el) {
        if (!el) return null;
        if (el.id === 'heroCharacterSlot') return 'heroCharacterSlot';
        if (el.classList.contains('mb-creative')) return 'mb-creative';
        if (el.classList.contains('mb-edge')) return 'mb-edge';
        if (el.classList.contains('mobile-backdrop-headline')) return 'mobile-backdrop-headline';
        if (el.classList.contains('title-wefind-mobile')) return 'title-wefind-mobile';
        if (el.classList.contains('title-wefind')) return 'title-wefind';
        if (el.classList.contains('title-the')) return 'title-the';
        if (el.classList.contains('title-creative')) return 'title-creative';
        if (el.classList.contains('title-edge')) return 'title-edge';
        if (el.classList.contains('hero-editorial-chunk')) return 'hero-editorial-chunk';
        if (el.classList.contains('headline-stack')) return 'headline-stack';
        return null;
      }

      function selectTarget(keyOrEl) {
        const el = typeof keyOrEl === 'string' ? (targetMap[keyOrEl] ? targetMap[keyOrEl].el() : null) : keyOrEl;
        if (!el) return;
        document.querySelectorAll('.drag-selected').forEach(n => n.classList.remove('drag-selected'));
        activeTarget = el;
        activeTarget.classList.add('drag-selected');

        const key = getTargetKey(el);
        if (hudTargetName) hudTargetName.textContent = key && targetMap[key] ? targetMap[key].name : el.tagName;
        
        // Update active chip
        document.querySelectorAll('.hud-chip').forEach(c => {
          c.classList.toggle('active', c.getAttribute('data-hud-select') === key);
        });

        // Update Layer button text
        if (hudZToggle) {
          const z = parseInt(window.getComputedStyle(el).zIndex, 10) || 1;
          hudZToggle.textContent = z >= 2 ? 'Layer: In Front' : 'Layer: Behind';
        }

        updateCoordsDisplay();
      }

      function updateCoordsDisplay() {
        if (!hudCoords || !activeTarget) return;
        const left = activeTarget.style.left || 'default';
        const top = activeTarget.style.top || 'default';
        const font = activeTarget.style.fontSize ? ` • ${activeTarget.style.fontSize}` : '';
        hudCoords.textContent = `X: ${left} | Y: ${top}${font}`;
      }

      function setEditMode(state) {
        isEditing = state;
        document.body.classList.toggle('is-editing', isEditing);
        if (toggleBtn) {
          toggleBtn.classList.toggle('active', isEditing);
          const lbl = toggleBtn.querySelector('.edit-label');
          if (lbl) lbl.textContent = isEditing ? 'Editing ON' : 'Drag & Edit';
        }

        // Enable contenteditable on text elements
        const textNodes = document.querySelectorAll('.mb-word, .title-row, .title-wefind-mobile');
        textNodes.forEach(node => {
          node.contentEditable = isEditing ? 'true' : 'false';
          node.spellcheck = false;
        });

        if (isEditing) {
          const mode = getActiveViewport();
          selectTarget(mode === 'mobile' ? 'mobile-backdrop-headline' : 'headline-stack');
        } else {
          document.querySelectorAll('.drag-selected').forEach(n => n.classList.remove('drag-selected'));
          activeTarget = null;
        }
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          setEditMode(!isEditing);
        });
      }

      if (hudClose) {
        hudClose.addEventListener('click', () => setEditMode(false));
      }

      // Pointer drag handling with mode-aware hit testing
      document.addEventListener('pointerdown', (e) => {
        if (!isEditing) return;
        if (e.target.closest('#editorToggle, #editorHud, .preview-layout-switcher')) return;

        const mode = getActiveViewport();
        let clickedTarget = null;

        if (mode === 'mobile') {
          if (e.target.closest('.mb-creative')) clickedTarget = document.querySelector('.mb-creative');
          else if (e.target.closest('.mb-edge')) clickedTarget = document.querySelector('.mb-edge');
          else if (e.target.closest('.mobile-backdrop-headline')) clickedTarget = document.querySelector('.mobile-backdrop-headline');
          else if (e.target.closest('.title-wefind-mobile')) clickedTarget = document.querySelector('.title-wefind-mobile');
          else if (e.target.closest('#heroCharacterSlot')) clickedTarget = document.getElementById('heroCharacterSlot');
          else if (e.target.closest('.hero-editorial-chunk')) clickedTarget = document.querySelector('.hero-editorial-chunk');
        } else {
          // Desktop / Laptop
          if (e.target.closest('.title-wefind')) clickedTarget = document.querySelector('.title-wefind');
          else if (e.target.closest('.title-the')) clickedTarget = document.querySelector('.title-the');
          else if (e.target.closest('.title-creative')) clickedTarget = document.querySelector('.title-creative');
          else if (e.target.closest('.title-edge')) clickedTarget = document.querySelector('.title-edge');
          else if (e.target.closest('#heroCharacterSlot')) clickedTarget = document.getElementById('heroCharacterSlot');
          else if (e.target.closest('.hero-editorial-chunk')) clickedTarget = document.querySelector('.hero-editorial-chunk');
          else if (e.target.closest('.headline-stack')) clickedTarget = document.querySelector('.headline-stack');
        }

        if (!clickedTarget) return;

        selectTarget(clickedTarget);
        startX = e.clientX;
        startY = e.clientY;
        hasMoved = false;

        const parent = clickedTarget.offsetParent || document.body;
        const pRect = parent.getBoundingClientRect();
        const tRect = clickedTarget.getBoundingClientRect();

        initialLeft = parseFloat(clickedTarget.style.left);
        initialTop = parseFloat(clickedTarget.style.top);
        if (isNaN(initialLeft)) initialLeft = tRect.left - pRect.left;
        if (isNaN(initialTop)) initialTop = tRect.top - pRect.top;

        function onPointerMove(pe) {
          const dx = pe.clientX - startX;
          const dy = pe.clientY - startY;
          if (!hasMoved && Math.hypot(dx, dy) > 3) {
            hasMoved = true;
            isDragging = true;
            try { clickedTarget.setPointerCapture(pe.pointerId); } catch(err) {}
          }
          if (hasMoved) {
            pe.preventDefault();
            const pos = window.getComputedStyle(clickedTarget).position;
            if (pos === 'static') clickedTarget.style.position = 'relative';
            clickedTarget.style.left = Math.round(initialLeft + dx) + 'px';
            clickedTarget.style.top = Math.round(initialTop + dy) + 'px';
            clickedTarget.style.right = 'auto';
            clickedTarget.style.bottom = 'auto';
            updateCoordsDisplay();
          }
        }

        function onPointerUp(pe) {
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          try { clickedTarget.releasePointerCapture(pe.pointerId); } catch(err) {}
          if (hasMoved) {
            saveEdits();
          }
          setTimeout(() => { isDragging = false; }, 50);
        }

        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp);
      });

      // Adjustments (Font, Scale, Dock, Color, Layer)
      function adjustFontSize(factor) {
        if (!activeTarget) return;
        const cur = parseFloat(window.getComputedStyle(activeTarget).fontSize);
        const next = Math.round(cur * factor);
        activeTarget.style.fontSize = next + 'px';
        updateCoordsDisplay();
        saveEdits();
      }

      function adjustImgScale(factor) {
        const slot = document.getElementById('heroCharacterSlot');
        if (!slot) return;
        const mode = getActiveViewport();
        if (mode === 'mobile') {
          const curH = parseFloat(slot.style.maxHeight) || 86;
          const nextH = Math.min(100, Math.max(40, Math.round(curH * factor)));
          slot.style.maxHeight = nextH + '%';
          slot.style.height = nextH + '%';
          slot.style.maxWidth = nextH + '%';
        } else {
          const curH = parseFloat(slot.style.maxHeight) || 93;
          const nextH = Math.min(100, Math.max(50, Math.round(curH * factor)));
          slot.style.maxHeight = nextH + 'vh';
          slot.style.maxWidth = (nextH + 11) + '%';
        }
        saveEdits();
      }

      function nudgeDock(deltaPx) {
        const dock = document.querySelector('.hero-editorial-chunk');
        if (!dock) return;
        const mode = getActiveViewport();
        if (mode === 'mobile') {
          const curMargin = parseFloat(dock.style.marginBottom) || 62;
          const next = Math.max(0, curMargin + deltaPx);
          dock.style.marginBottom = next + 'px';
        } else {
          const curMargin = parseFloat(dock.style.marginTop) || 4;
          const next = curMargin - deltaPx;
          dock.style.marginTop = next + 'px';
        }
        saveEdits();
      }

      if (hudFontPlus) hudFontPlus.addEventListener('click', () => adjustFontSize(1.08));
      if (hudFontMinus) hudFontMinus.addEventListener('click', () => adjustFontSize(0.92));
      if (hudImgMinus) hudImgMinus.addEventListener('click', () => adjustImgScale(0.95));
      if (hudImgPlus) hudImgPlus.addEventListener('click', () => adjustImgScale(1.05));
      if (hudDockUp) hudDockUp.addEventListener('click', () => nudgeDock(6));
      if (hudDockDown) hudDockDown.addEventListener('click', () => nudgeDock(-6));

      if (hudZToggle) {
        hudZToggle.addEventListener('click', () => {
          if (!activeTarget) return;
          const curZ = parseInt(window.getComputedStyle(activeTarget).zIndex, 10) || 1;
          const nextZ = curZ >= 2 ? 1 : 3;
          activeTarget.style.zIndex = nextZ;
          hudZToggle.textContent = nextZ >= 2 ? 'Layer: In Front' : 'Layer: Behind';
          saveEdits();
        });
      }

      if (hudColorCycle) {
        hudColorCycle.addEventListener('click', () => {
          if (!activeTarget) return;
          const colors = ['#0F172A', '#1D4ED8', '#FFFFFF', '#0B132B'];
          const cur = activeTarget.style.color || window.getComputedStyle(activeTarget).color;
          const next = colors[(colors.indexOf(cur) + 1) % colors.length] || colors[0];
          activeTarget.style.color = next;
          activeTarget.querySelectorAll('*').forEach(n => n.style.color = next);
          hudColorCycle.textContent = next === '#0F172A' ? 'Color: Dark' : (next === '#FFFFFF' ? 'Color: White' : 'Color: Blue');
          saveEdits();
        });
      }

      // Responsive Copy CSS
      if (hudCopyCss) {
        hudCopyCss.addEventListener('click', () => {
          if (!activeTarget) return;
          const mode = getActiveViewport();
          const key = getTargetKey(activeTarget);
          let sel = '.' + key;
          if (activeTarget.id) sel = '#' + activeTarget.id;

          const top = activeTarget.style.top || 'auto';
          const left = activeTarget.style.left || 'auto';
          const font = activeTarget.style.fontSize || '';
          const z = activeTarget.style.zIndex || '';
          const col = activeTarget.style.color || '';
          const mb = activeTarget.style.marginBottom || '';
          const mt = activeTarget.style.marginTop || '';
          const maxH = activeTarget.style.maxHeight || '';

          let rules = `  top: ${top};\n  left: ${left};\n`;
          if (font) rules += `  font-size: ${font};\n`;
          if (col) rules += `  color: ${col};\n`;
          if (mb) rules += `  margin-bottom: ${mb};\n`;
          if (mt) rules += `  margin-top: ${mt};\n`;
          if (maxH) rules += `  max-height: ${maxH};\n`;
          if (z) rules += `  z-index: ${z};\n`;

          let css = '';
          if (mode === 'mobile') {
            css = `/* Mobile (<900px) Overrides */\n@media (max-width: 900px) {\n  ${sel} {\n${rules}  }\n}`;
          } else {
            css = `/* Laptop / Desktop (>900px) Overrides */\n@media (min-width: 901px) {\n  ${sel} {\n${rules}  }\n}`;
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(css).then(showCopiedNotice);
          } else {
            const ta = document.createElement('textarea');
            ta.value = css;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showCopiedNotice();
          }
        });
      }

      function showCopiedNotice() {
        const orig = hudCopyCss.textContent;
        hudCopyCss.textContent = '✓ Copied!';
        hudCopyCss.style.background = '#059669';
        setTimeout(() => {
          hudCopyCss.textContent = orig;
          hudCopyCss.style.background = '';
        }, 1500);
      }

      // Reset active viewport adjustments only
      if (hudReset) {
        hudReset.addEventListener('click', () => {
          const mode = getActiveViewport();
          const modeName = mode === 'mobile' ? 'Mobile (<900px)' : 'Laptop / Desktop (>900px)';
          if (confirm(`Reset custom adjustments for ${modeName} back to original?`)) {
            try {
              localStorage.removeItem(getStorageKey());
            } catch(e) {}
            clearAllInlineStyles();
            restoreEdits();
            updateCoordsDisplay();
          }
        });
      }

      // Isolated Persistence
      function saveEdits() {
        const mode = getActiveViewport();
        const data = {};
        Object.keys(targetMap).forEach(key => {
          const item = targetMap[key];
          if (item.viewport === 'both' || item.viewport === mode) {
            const el = item.el();
            if (el) {
              const isText = el.classList.contains('mb-word') || el.classList.contains('title-row') || el.classList.contains('title-wefind-mobile');
              data[key] = {
                left: el.style.left || '',
                top: el.style.top || '',
                fontSize: el.style.fontSize || '',
                zIndex: el.style.zIndex || '',
                color: el.style.color || '',
                maxHeight: el.style.maxHeight || '',
                maxWidth: el.style.maxWidth || '',
                marginBottom: el.style.marginBottom || '',
                marginTop: el.style.marginTop || '',
                text: isText ? el.innerText : null
              };
            }
          }
        });
        try {
          localStorage.setItem(getStorageKey(), JSON.stringify(data));
        } catch(e) {}
      }

      function restoreEdits() {
        clearAllInlineStyles();
        const mode = getActiveViewport();
        try {
          const raw = localStorage.getItem(getStorageKey());
          if (!raw) return;
          const data = JSON.parse(raw);
          Object.keys(data).forEach(key => {
            const item = targetMap[key];
            if (!item) return;
            if (item.viewport !== 'both' && item.viewport !== mode) return;

            const el = item.el();
            if (el && data[key]) {
              const d = data[key];
              if (d.left) el.style.left = d.left;
              if (d.top) el.style.top = d.top;
              if (d.fontSize) el.style.fontSize = d.fontSize;
              if (d.zIndex) el.style.zIndex = d.zIndex;
              if (d.color) {
                el.style.color = d.color;
                el.querySelectorAll('*').forEach(n => n.style.color = d.color);
              }
              if (d.maxHeight) {
                el.style.maxHeight = d.maxHeight;
                el.style.height = d.maxHeight;
              }
              if (d.maxWidth) {
                el.style.maxWidth = d.maxWidth;
              }
              if (d.marginBottom) {
                el.style.marginBottom = d.marginBottom;
              }
              if (d.marginTop) {
                el.style.marginTop = d.marginTop;
              }
              if (d.left || d.top) {
                const pos = window.getComputedStyle(el).position;
                if (pos === 'static') el.style.position = 'relative';
              }
              if (d.text) {
                el.innerText = d.text;
              }
            }
          });
        } catch(err) {
          console.warn('Failed restoring edits', err);
        }
      }

      // Live text edits
      document.addEventListener('input', (e) => {
        if (isEditing && (e.target.classList.contains('mb-word') || e.target.classList.contains('title-row') || e.target.classList.contains('title-wefind-mobile'))) {
          saveEdits();
        }
      });

      // Viewport crossover / resize watcher
      let lastViewport = getActiveViewport();
      window.addEventListener('resize', () => {
        const currentViewport = getActiveViewport();
        if (currentViewport !== lastViewport) {
          lastViewport = currentViewport;
          clearAllInlineStyles();
          restoreEdits();
          updateHudChipsForMode();
          updateHudModeBadge();
          if (isEditing) {
            selectTarget(currentViewport === 'mobile' ? 'mobile-backdrop-headline' : 'headline-stack');
          }
        }
      });

      // Initial boot
      updateHudModeBadge();
      updateHudChipsForMode();
      restoreEdits();
    })();
  </script>

</body>
</html>
