<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="750" fill="url(#bg_sam)"/>
  
  <!-- Racing Geometric Kinetic Streaks -->
  <circle cx="150" cy="180" r="120" fill="url(#crimson)" opacity="0.8"/>
  <polygon points="180,0 360,0 240,480 60,480" fill="url(#gold)" opacity="0.75"/>
  <path d="M 0 500 Q 280 420 600 560 L 600 750 L 0 750 Z" fill="#7F1D1D" opacity="0.9"/>
  
  <!-- Dynamic Speed Lines -->
  <line x1="0" y1="160" x2="600" y2="100" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.45"/>
  <line x1="0" y1="220" x2="600" y2="160" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="20 12" opacity="0.6"/>
  
  <!-- Stylized Action Director Figure -->
  <g transform="translate(300, 160)">
    <!-- Racing Bomber Jacket & Torso filling down -->
    <path d="M -200 600 L -170 280 C -150 160 -80 120 0 120 C 80 120 150 160 170 280 L 200 600 Z" fill="#18181B"/>
    <path d="M -60 130 L 0 240 L 60 130 Z" fill="#EF4444"/>
    <line x1="-120" y1="260" x2="-40" y2="180" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Neck -->
    <rect x="-24" y="55" width="48" height="75" rx="10" fill="#B87D56"/>
    
    <!-- Head Base -->
    <ellipse cx="0" cy="45" rx="64" ry="74" fill="#CF9A76"/>
    
    <!-- Modern Textured Crop Hair -->
    <path d="M -68 30 C -68 -48 68 -48 68 30 C 45 15 -10 10 -68 30 Z" fill="#0A0A0C"/>
    
    <!-- Aviator Pursuit Sunglasses -->
    <ellipse cx="-26" cy="42" rx="22" ry="16" fill="#111827"/>
    <ellipse cx="26" cy="42" rx="22" ry="16" fill="#111827"/>
    <line x1="-6" y1="36" x2="6" y2="36" stroke="#F59E0B" stroke-width="3"/>
    <path d="M -48 38 L -64 34" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M 48 38 L 64 34" stroke="#F59E0B" stroke-width="2.5"/>
    <ellipse cx="-26" cy="42" rx="18" ry="12" fill="#EF4444" opacity="0.65"/>
    <ellipse cx="26" cy="42" rx="18" ry="12" fill="#F59E0B" opacity="0.65"/>
    
    <!-- Chiseled Jaw & Confident Stance -->
    <path d="M -2 60 L -3 70 L 5 70" fill="none" stroke="#8C5331" stroke-width="2" stroke-linecap="round"/>
    <path d="M -16 88 Q 0 96 16 88" fill="none" stroke="#5A2E17" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>