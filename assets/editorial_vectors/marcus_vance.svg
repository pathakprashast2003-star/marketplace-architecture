<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E8DC"/>
      <stop offset="100%" stop-color="#DDC3AC"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D95D39"/>
      <stop offset="100%" stop-color="#9E3218"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243E36"/>
      <stop offset="100%" stop-color="#12201B"/>
    </linearGradient>
    <linearGradient id="mustard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5B726"/>
      <stop offset="100%" stop-color="#D98A00"/>
    </linearGradient>
  </defs>
  
  <!-- Canvas Base -->
  <rect width="600" height="750" fill="url(#bg_m)"/>
  
  <!-- Abstract Bauhaus Geometric Blocks & Sun -->
  <circle cx="450" cy="190" r="130" fill="url(#mustard)" opacity="0.9"/>
  <path d="M 0 0 L 280 0 L 160 380 L 0 280 Z" fill="url(#forest)" opacity="0.95"/>
  <path d="M 400 320 Q 560 220 600 420 L 600 750 L 300 750 Z" fill="url(#terracotta)" opacity="0.85"/>
  <circle cx="130" cy="380" r="80" fill="#E07A5F" opacity="0.7"/>

  <!-- Architectural Arch Frame -->
  <path d="M 120 750 L 120 220 A 180 180 0 0 1 480 220 L 480 750" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
  
  <!-- Stylized Editorial Filmmaker Figure -->
  <g transform="translate(300, 160)">
    <!-- Coat & Torso filling down to bottom -->
    <path d="M -200 600 L -180 280 C -160 160 -90 110 0 110 C 90 110 160 160 180 280 L 200 600 Z" fill="#14241F"/>
    <!-- Terracotta Lapels & Ochre Tie -->
    <path d="M -70 120 L 0 240 L 70 120 Z" fill="#D95D39"/>
    <polygon points="0,150 -20,260 20,260" fill="#F5B726"/>
    
    <!-- Neck -->
    <rect x="-24" y="55" width="48" height="75" rx="12" fill="#D8A47F"/>
    
    <!-- Head Base -->
    <ellipse cx="0" cy="45" rx="66" ry="76" fill="#E8B896"/>
    
    <!-- Editorial Hair & Filmmaker Cap -->
    <path d="M -72 35 C -72 -50 72 -50 72 35 C 50 15 10 5 -30 15 C -55 22 -68 30 -72 35 Z" fill="#14241F"/>
    <path d="M -80 15 C -60 -35 30 -55 80 -8 C 60 -12 -10 -18 -80 15 Z" fill="#F5B726"/>
    
    <!-- Facial Features -->
    <ellipse cx="-24" cy="44" rx="5" ry="3.5" fill="#14241F"/>
    <ellipse cx="24" cy="44" rx="5" ry="3.5" fill="#14241F"/>
    <path d="M -2 46 L -4 68 L 6 68" fill="none" stroke="#B87D56" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -18 88 Q 0 98 18 88" fill="none" stroke="#B23A1B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -36 32 Q -24 26 -12 32" fill="none" stroke="#14241F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 12 32 Q 24 26 36 32" fill="none" stroke="#14241F" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Gold Hoop Earring -->
    <circle cx="68" cy="58" r="8" fill="none" stroke="#F5B726" stroke-width="3.5"/>
  </g>
  
  <!-- Modernist Grid Overlay Whispers -->
  <line x1="50" y1="0" x2="50" y2="750" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
  <line x1="550" y1="0" x2="550" y2="750" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="210" x2="600" y2="210" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
</svg>