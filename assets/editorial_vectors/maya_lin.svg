<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDEAFE"/>
      <stop offset="100%" stop-color="#E2F1FE"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#034B75"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  
  <!-- Sky Canvas Base -->
  <rect width="600" height="750" fill="url(#bg_sky)"/>
  
  <!-- Coastal Dunes & Crimson Sun -->
  <circle cx="160" cy="180" r="120" fill="url(#clay)" opacity="0.9"/>
  <path d="M 280 0 Q 480 100 600 50 L 600 480 Q 420 360 240 500 Z" fill="url(#cobalt)" opacity="0.8"/>
  <path d="M 0 460 Q 180 340 400 420 L 600 500 L 600 750 L 0 750 Z" fill="url(#sand)" opacity="0.85"/>
  
  <!-- Drone Flight Trajectory Orbit Lines -->
  <ellipse cx="400" cy="180" rx="170" ry="70" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.7" transform="rotate(-18 400 180)"/>
  <ellipse cx="200" cy="280" rx="140" ry="50" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" transform="rotate(12 200 280)"/>

  <!-- Stylized Aerial Captain Silhouette -->
  <g transform="translate(300, 160)">
    <!-- Flight Jacket & Torso filling down -->
    <path d="M -200 600 L -170 280 C -150 160 -80 120 0 120 C 80 120 150 160 170 280 L 200 600 Z" fill="#0C4A6E"/>
    <path d="M -60 130 L 0 240 L 60 130 Z" fill="#F59E0B"/>
    <circle cx="0" cy="200" r="14" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Neck -->
    <rect x="-22" y="55" width="44" height="75" rx="10" fill="#E8B896"/>
    
    <!-- Head Base -->
    <ellipse cx="0" cy="45" rx="64" ry="74" fill="#F5CFB3"/>
    
    <!-- Sleek High-Ponytail / Flight Bun Hair -->
    <path d="M -68 40 C -68 -45 68 -45 68 40 C 45 20 -10 10 -68 40 Z" fill="#0B1B2B"/>
    <circle cx="0" cy="-35" r="28" fill="#0B1B2B"/>
    <path d="M -10 -30 Q 30 -50 45 -20" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    
    <!-- FPV Pilot Goggles (Sleek Cerulean Tint Visor) -->
    <path d="M -54 28 C -54 20 -28 18 0 18 C 28 18 54 20 54 28 L 50 56 C 50 64 26 66 0 66 C -26 66 -50 64 -50 56 Z" fill="#0284C7"/>
    <ellipse cx="-24" cy="42" rx="18" ry="12" fill="#38BDF8" opacity="0.8"/>
    <ellipse cx="24" cy="42" rx="18" ry="12" fill="#38BDF8" opacity="0.8"/>
    <line x1="-54" y1="36" x2="-68" y2="34" stroke="#F59E0B" stroke-width="5"/>
    <line x1="54" y1="36" x2="68" y2="34" stroke="#F59E0B" stroke-width="5"/>
    
    <!-- Lip & Minimal Nose -->
    <path d="M -2 60 L -3 70 L 4 70" fill="none" stroke="#C28965" stroke-width="2" stroke-linecap="round"/>
    <path d="M -15 88 Q 0 96 15 88" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>